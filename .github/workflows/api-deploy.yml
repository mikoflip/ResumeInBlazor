# Builds and publishes the API.

name: API

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ResumeInBlazor.Api/**'
      - 'ResumeInBlazor.Contracts/**'
      - 'ResumeInBlazor.sln'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ResumeInBlazor.Api/**'
      - 'ResumeInBlazor.Contracts/**'
      - 'ResumeInBlazor.sln'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Supersede redundant PR runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore ResumeInBlazor.Api/ResumeInBlazor.Api.csproj

      - name: Build
        run: dotnet build ResumeInBlazor.Api/ResumeInBlazor.Api.csproj --no-restore --configuration Release

      - name: Publish
        run: dotnet publish ResumeInBlazor.Api/ResumeInBlazor.Api.csproj -c Release -o publish --no-build

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api
          path: publish
