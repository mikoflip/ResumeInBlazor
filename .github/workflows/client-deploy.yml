# Builds the Blazor WebAssembly client and deploys it to GitHub Pages.

name: Client

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ResumeInBlazor.Client/**'
      - 'ResumeInBlazor.Contracts/**'
      - 'ResumeInBlazor.sln'
      - '.github/workflows/client-deploy.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ResumeInBlazor.Client/**'
      - 'ResumeInBlazor.Contracts/**'
      - 'ResumeInBlazor.sln'
      - '.github/workflows/client-deploy.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Supersede redundant PR runs; leave main (Pages deploy) runs alone.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install dependencies
        run: npm install
        working-directory: ResumeInBlazor.Client

      - name: Build Tailwind CSS
        run: npm run build:css
        working-directory: ResumeInBlazor.Client

      - name: Restore dependencies
        run: dotnet restore ResumeInBlazor.Client/ResumeInBlazor.Client.csproj

      - name: Build
        run: dotnet build ResumeInBlazor.Client/ResumeInBlazor.Client.csproj --no-restore --configuration Release

      - name: Publish
        run: dotnet publish ResumeInBlazor.Client/ResumeInBlazor.Client.csproj -c Release -o publish --no-build

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'publish/wwwroot'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
